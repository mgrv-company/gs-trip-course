<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘의 고성 추천 카드</title>
<link rel="stylesheet" href="../../design/tokens.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #e5e5e2; } /* 카드 밖 여백 — 스크린샷 시 .card 요소만 잘라내므로 실제로는 안 보임 */
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  /* 카드는 사이트(index.html)와 같은 톤을 쓴다: radius 0, 헤어라인 구분, 회색 톤 위주(퍼플·초록은
     상태 신호 외에는 안 씀), 이모지는 이동수단 정도만 남긴다. 정보는 태그·배지 나열 대신 문장체로
     풀어 쓴다. (2026-09-02 재정리) */
  .card { width: 1080px; height: 1350px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }

  .photo-wrap { position: relative; height: 820px; flex: 0 0 auto; background: var(--ink); }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-wrap.noimg { background: var(--ink); }
  .photo-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(31,30,29,.92) 0%, rgba(31,30,29,.15) 55%, rgba(31,30,29,0) 75%); }

  .eyebrow { position: absolute; left: 56px; top: 56px; display: inline-flex; align-items: center; background: var(--ink); color: #fff; font-size: 26px; font-weight: 800; padding: 10px 22px; letter-spacing: -0.01em; }
  .date { position: absolute; right: 56px; top: 66px; color: #fff; font-size: 24px; font-weight: 600; opacity: .92; font-variant-numeric: tabular-nums; }

  .name-block { position: absolute; left: 56px; right: 56px; bottom: 44px; color: #fff; }
  .name-block .nm { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .name-block .cat { font-size: 28px; font-weight: 600; opacity: .88; margin-top: 12px; }

  .body { flex: 1; padding: 40px 56px 56px; display: flex; flex-direction: column; gap: 24px; }

  .sentences { display: flex; flex-direction: column; gap: 10px; font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.5; }

  .blurb { border-left: 4px solid #55564e; padding: 4px 0 4px 28px; color: #55564e; }
  .blurb .label { font-size: 22px; font-weight: 700; opacity: .75; margin-bottom: 6px; }
  .blurb .note { font-size: 30px; font-weight: 700; line-height: 1.55; }
  .blurb .closing { font-size: 26px; font-weight: 600; line-height: 1.55; margin-top: 10px; }

  .foot { margin-top: auto; padding-top: 28px; border-top: 1px solid var(--ink); display: flex; align-items: center; justify-content: flex-end; }
  .foot .logo { height: 30px; }
</style>
</head>
<body>
<article class="card" id="card">
  <div class="photo-wrap noimg" id="photoWrap">
    <img id="photoImg" alt="" style="display:none;">
    <div class="photo-scrim"></div>
    <div class="eyebrow">오늘의 추천</div>
    <div class="date" id="dateEl"></div>
    <div class="name-block">
      <div class="nm" id="nameEl"></div>
      <div class="cat" id="catEl"></div>
    </div>
  </div>
  <div class="body">
    <div class="sentences" id="sentEl"></div>
    <div class="blurb" id="blurbEl" style="display:none;">
      <div class="label">코멘트</div>
      <div class="note" id="noteEl"></div>
      <div class="closing" id="closingEl"></div>
    </div>
    <div class="foot">
      <img class="logo" src="../../assets/mangrove-goseong-logo-black.svg" onerror="this.src='../../assets/mangrove-goseong-logo.svg'; this.style.filter='invert(1)';" alt="맹그로브 고성">
    </div>
  </div>
</article>

<script>
// data 형태: { name, category, moveMode, moveMin, hoursStart, hoursEnd, hoursClosed,
//              ratingScore, ratingCount, menu, blurb, img, date }
// daily_pick.py의 build_card_data()가 만들어 넘긴다 (automation/daily-card/render.mjs 참고)
function renderCard(data) {
  data = data || {};
  const $ = id => document.getElementById(id);

  $('nameEl').textContent = data.name || '';
  $('catEl').textContent = data.category || '';
  $('dateEl').textContent = data.date || '';

  const photoWrap = $('photoWrap'), photoImg = $('photoImg');
  if (data.img) {
    photoImg.src = data.img;
    photoImg.style.display = 'block';
    photoWrap.classList.remove('noimg');
  }

  // 정보 문장 3종: 이동시간 / 메뉴 / 별점 — 값 없는 항목은 조용히 생략한다.
  const sentences = [];
  if (data.moveMode && data.moveMin) sentences.push(`맹그로브 고성에서 ${data.moveMode}로 ${data.moveMin}분 걸려요.`);
  if (data.menu) sentences.push(`메뉴는 '${data.menu}'가 있어요.`);
  if (data.ratingScore != null && data.ratingCount != null) sentences.push(`네이버 지도 별점은 ${data.ratingScore}점이고, 리뷰는 ${data.ratingCount}건이에요.`);
  $('sentEl').innerHTML = sentences.map(esc).join('<br>');

  // 코멘트 + 영업시간 안내(문장체) — 코멘트가 있을 때만 이 블록 전체를 노출
  if (data.blurb) {
    $('noteEl').textContent = data.blurb;
    let closing = '';
    if (data.hoursClosed) closing = '오늘은 쉬는 날이에요.';
    else if (data.hoursStart && data.hoursEnd) closing = `오늘 ${data.hoursStart}부터 ${data.hoursEnd}까지 영업해요. 한 번 들러보시는 건 어때요?`;
    $('closingEl').textContent = closing;
    $('blurbEl').style.display = '';
  }

  $('card').dataset.ready = '1';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 브라우저에서 직접 열어 미리보기할 때만 쓰는 샘플 데이터.
// render.mjs가 자동화 실행 시 window.__NO_AUTO__ = true 를 먼저 심어 이 자동렌더를 막는다.
if (!window.__NO_AUTO__) {
  renderCard({
    name: '하마식당', category: '식사', moveMode: '도보', moveMin: 14,
    hoursStart: '11:30', hoursEnd: '15:30', hoursClosed: false,
    ratingScore: 4.68, ratingCount: 705, menu: '참치 후토마끼 5pcs, 마제소바',
    blurb: '이 정도로 큰 후토마끼는 없을걸요. 속초 등대해변 근처 식사로 추천',
    img: '', date: '8월 14일 (금)',
  });
}
</script>
</body>
</html>
