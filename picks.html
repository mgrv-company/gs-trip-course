<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP: index.html 과 같은 규칙. 연결은 어드민 백엔드(공개 목록)만, 그림은 워커·사이트 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src https://gs-trip-admin.mangrove-goseong.workers.dev; base-uri 'none'; form-action 'none'">
<title>맹그로브 고성 · 추천 가게 모음</title>
<!-- 워크앤스테이 가이드(노션) 안에 끼워 넣는 페이지라 검색에는 안 잡히게 -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf8">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="design/tokens.css">
<style>
  /* 추천 가게 모음 — 카드 만들기에서 트립코스로 보낸 '오늘의 PICK' 카드를 날짜별로 모아 보여준다 (2026-10-07).
     워크앤스테이 가이드(노션) 페이지에 iframe 으로 들어가므로 제목·상단바가 없다(노션이 준다).
     규칙은 index.html 과 같다: 모서리 각지게, 그림자 없음, 보라(--purple)는 Today 하나에만. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  button, a { touch-action: manipulation; }
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  main { container-type: inline-size; padding: 8px 16px 40px; max-width: 1200px; margin: 0 auto; }

  /* 구역 머리: 1px 잉크선 위에 제목 (index.html .notice 와 같은 말투) */
  .sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 32px 0 16px; padding-top: 12px; border-top: 1px solid var(--ink); }
  .sec:first-child { margin-top: 16px; }
  .sec h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }
  .sec .ctl { display: none; align-items: center; gap: 8px; }
  .sec .pos { font-size: 12.5px; color: var(--gray); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  .chev { width: 36px; height: 36px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0; }
  .chev:disabled { opacity: .35; cursor: default; }
  .chev:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  .chev svg { width: 16px; height: 16px; }

  /* 카드 한 장: 그림(카드 이미지의 위 41% — 이름 띠 위까지) + 이름·업종·날짜 + 지도 링크 */
  .ph { display: block; position: relative; overflow: hidden; background: var(--soft); width: 100%; border: 0; padding: 0; cursor: pointer; border-radius: 0; }
  .ph img { position: absolute; top: 0; left: 50%; height: calc(100% / 0.41); width: auto; transform: translateX(-50%); display: block; }
  .ph:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  .info { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .nm { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; overflow-wrap: anywhere; }
  .sub { font-size: 12.5px; color: var(--gray); margin-top: 4px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .today { display: inline-block; background: var(--purple); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; line-height: 1.3; }
  .map { flex: none; width: 36px; height: 36px; margin: -6px -8px 0 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; }
  .map svg { width: 18px; height: 18px; }
  .map:hover { color: var(--purple-deep); }
  .map:focus-visible { outline: 3px solid var(--purple); outline-offset: -4px; }

  /* NEW(최근 7일): 옆으로 넘기기. 휴대폰 1장(+다음 장 살짝), PC 3장 꼭 맞게 */
  .track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; margin: 0 -16px; padding: 0 16px 4px; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 88%; scroll-snap-align: start; min-width: 0; }
  .slide .ph { aspect-ratio: 720 / 426; }
  @container (min-width: 620px) {
    .track { margin: 0; padding: 0 0 4px; gap: 16px; }
    .slide { flex-basis: calc((100% - 32px) / 3); }
    .sec .ctl { display: flex; }
  }

  /* 지난 추천: 업종 고르기 + 격자. 휴대폰 2열, PC 4열. 작은 타일은 '오늘의 PICK' 스티커 아래부터 보여준다(작으면 보라 얼룩으로만 보여서) */
  .segs { display: flex; border: 1px solid var(--line); margin: 0 0 16px; }
  .segs[hidden] { display: none; }
  .seg { flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--line); background: #fff; color: #4a4945; font: 600 13px/1.2 inherit; font-family: inherit; cursor: pointer; border-radius: 0; padding: 6px 4px; }
  .seg:last-child { border-right: 0; }
  .seg[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg:focus-visible { outline: 3px solid var(--purple); outline-offset: -3px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
  .grid .ph { aspect-ratio: 4 / 3; }
  .grid .ph img { height: calc(100% / 0.35); top: -19.1%; }
  .grid .nm { font-size: 14px; }
  .grid .sub { font-size: 12px; }
  @container (min-width: 620px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 16px; } }
  .empty { color: var(--gray); font-size: 14px; text-align: center; padding: 40px 10px; grid-column: 1 / -1; }

  /* 크게 보기 (iframe 안이라 그 창 전체를 덮는다) */
  .lb { position: fixed; inset: 0; background: rgba(31, 30, 29, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; z-index: 5; }
  .lb[hidden] { display: none; }
  .lb img { max-height: calc(100% - 72px); max-width: 100%; object-fit: contain; display: block; }
  .lb .row { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  .lb a, .lb button { flex: 1; font: 600 14px/1 inherit; font-family: inherit; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; border-radius: 0; }
  .lb a { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, .8); }
  .lb button { background: #fff; color: #1f1e1d; border: 0; flex: 0 0 96px; }
  .lb a:focus-visible, .lb button:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>
</head>
<body>
<main id="main">
  <p class="empty" id="loading">불러오는 중…</p>
</main>
<div class="lb" id="lb" hidden>
  <img id="lbImg" alt="">
  <div class="row"><a id="lbMap" target="_blank" rel="noopener">네이버 지도에서 보기</a><button type="button" id="lbClose">닫기</button></div>
</div>
<script src="picks.js?v=1"></script>
</body>
</html>
